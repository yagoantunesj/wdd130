<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilos/questionario.css">

    <title>Wdd130 - Formularios</title>
</head>

<body>
    <header>
        <h1>Questionário de HTML e CSS</h1>
    </header>

    <main>
        <form action="">
            <label for="q1">1. O que significa a sigla CSS?</label>
            <input type="text" name="q1" id="q1">

            <label for="q2">2. Como os atributos 'id' e 'class' são selecionados no CSS?</label>
            <textarea name="q2" id="q2" rows="4" cols="50"></textarea>

            <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Escolha uma opção...</option>
                <option value="a">/* Este é um comentário CSS */</option>
                <option value="b">// Este é um comentário CSS</option>
                <option value="c"><!-- Este é um comentário CSS --></option>
            </select>
            <label for="q4">4. Qual é a margem inferior dada por esta declaração?</label>
            <p>margin: 10px 5px 15px;</p>
            <input type="number" name="q4" id="q4">

            <button type="submit">Enviar questionário</button>
        </form>
    </main>


</body>

</html>
